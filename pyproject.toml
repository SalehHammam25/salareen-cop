[project]
name = "salareen-cop"
version = "0.1.0"
description = "Deterministic cop peer for the Police-Thief P2P project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=45,<47",
    "fastmcp>=2.0,<3",
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "ruff>=0.16.3,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
